<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Players - SkyRage Scoreboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <style>
        .player-table {
            margin: 2rem 0;
            width: 100%;
            border-collapse: collapse;
        }
        .player-table th {
            text-align: left;
            padding: 1rem;
            background: #f5f5f5;
            border-bottom: 2px solid #ddd;
        }
        .player-table td {
            padding: 1rem;
            border-bottom: 1px solid #eee;
        }
        .player-table tr:hover {
            background: #f9f9f9;
        }
        .surname-input {
            width: 100%;
            margin: 0;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1em;
        }
        .surname-input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.1);
        }
        .surname-input::placeholder {
            color: #999;
            font-style: italic;
        }
        .back-button {
            margin: 2rem 0 1rem 0;
        }
        .no-players {
            text-align: center;
            padding: 2rem;
            color: #666;
        }
        .surname-empty {
            color: #999;
            font-style: italic;
        }
        .delete-btn {
            background: transparent;
            border: 1px solid #999;
            color: #666;
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            border-radius: 4px;
            font-size: 1.2em;
            transition: all 0.3s ease;
            margin-right: 0.5rem;
        }
        .delete-btn:hover {
            background: #f0f0f0;
            border-color: #666;
        }
        .delete-btn.confirm-delete {
            background: #dc3545;
            color: white;
            border-color: #dc3545;
        }
        .delete-btn.confirm-delete:hover {
            background: #c82333;
            border-color: #bd2130;
        }
        .player-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        .error-message {
            color: #dc3545;
            font-size: 0.9em;
            margin-top: 0.5rem;
            display: none;
        }
        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 2rem 0 1rem 0;
            gap: 1rem;
        }
        .delete-dangling-btn {
            background: #dc3545;
            color: white;
            border: 1px solid #dc3545;
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        .delete-dangling-btn:hover {
            background: #c82333;
            border-color: #bd2130;
        }
        .delete-dangling-btn.confirm-delete {
            background: #721c24;
            border-color: #721c24;
        }
        .delete-dangling-btn.confirm-delete:hover {
            background: #5a161d;
            border-color: #5a161d;
        }
    </style>
</head>

<body>
    <main class="container">
        <header>
            <h1>Players</h1>
            <p class="lead">View and edit all recorded players.</p>
        </header>
        
        <div class="actions-bar">
            <a href="/" role="button" class="secondary">← Back to Home</a>
            <button 
                id="delete-dangling-btn" 
                class="delete-dangling-btn"
                onclick="handleDeleteDanglingPlayers(this)"
                title="Delete all players not associated with any game"
            >
                Delete Dangling Players
            </button>
        </div>
        
        <section aria-labelledby="players-section">
            <h2 id="players-section">All Players</h2>
            {% if players %}
                <table class="player-table">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Surname</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for player in players %}
                        <tr id="player-row-{{ player.username }}">
                            <td><strong>{{ player.username }}</strong></td>
                            <td>
                                <input 
                                    type="text" 
                                    class="surname-input"
                                    name="surname"
                                    value="{{ player.surname or '' }}"
                                    placeholder="(no surname)"
                                    hx-post="/player/update"
                                    hx-trigger="change, blur"
                                    hx-vals='{"username": "{{ player.username }}"}'
                                    hx-swap="none"
                                />
                            </td>
                            <td>
                                <div class="player-actions">
                                    <button 
                                        class="delete-btn" 
                                        onclick="handlePlayerDeleteClick(this, '{{ player.username }}')" 
                                        title="Delete player"
                                    >
                                        🗑️
                                    </button>
                                </div>
                                <div id="error-{{ player.username }}" class="error-message"></div>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            {% else %}
                <div class="no-players">
                    <p>No players recorded yet. Players are automatically created when you start games.</p>
                </div>
            {% endif %}
        </section>
    </main>
    
    <script>
        function handleDeleteDanglingPlayers(button) {
            if (button.classList.contains('confirm-delete')) {
                // Second click - delete dangling players
                button.disabled = true;
                button.innerHTML = 'Deleting...';
                
                fetch('/api/dangling_players', {
                    method: 'DELETE'
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    // Show detailed information
                    if (data.deleted_count > 0) {
                        alert(`✅ Deleted ${data.deleted_count} dangling player(s):\n${data.deleted_usernames.join(', ')}\n\nTotal players: ${data.total_players}\nPlayers in games: ${data.protected_players}`);
                        window.location.reload();
                    } else {
                        alert(`ℹ️ No dangling players found.\n\nTotal players: ${data.total_players}\nAll players are associated with games: ${data.protected_players}`);
                        button.disabled = false;
                        button.innerHTML = 'Delete Dangling Players';
                        button.classList.remove('confirm-delete');
                    }
                })
                .catch(error => {
                    console.error('Error deleting dangling players:', error);
                    alert('An error occurred while deleting dangling players: ' + error.message);
                    button.disabled = false;
                    button.innerHTML = 'Delete Dangling Players';
                    button.classList.remove('confirm-delete');
                });
            } else {
                // First click - enter confirmation mode
                button.classList.add('confirm-delete');
                button.innerHTML = 'Click again to confirm';
                
                // Reset after 3 seconds
                setTimeout(() => {
                    button.classList.remove('confirm-delete');
                    button.innerHTML = 'Delete Dangling Players';
                }, 3000);
            }
        }

        function handlePlayerDeleteClick(button, username) {
            const errorDiv = document.getElementById(`error-${username}`);
            
            if (button.classList.contains('confirm-delete')) {
                // Second click - delete the player
                errorDiv.style.display = 'none';
                errorDiv.textContent = '';
                
                fetch(`/api/players/${username}`, {
                    method: 'DELETE'
                })
                .then(response => {
                    if (response.ok) {
                        // Remove the player row from the DOM
                        document.getElementById(`player-row-${username}`).remove();
                    } else if (response.status === 400) {
                        // Player has linked games - show error
                        return response.json().then(data => {
                            errorDiv.textContent = data.detail || 'Cannot delete player with game history.';
                            errorDiv.style.display = 'block';
                            button.classList.remove('confirm-delete');
                            button.innerHTML = '🗑️';
                        });
                    } else {
                        throw new Error('Failed to delete player');
                    }
                })
                .catch(error => {
                    console.error('Error deleting player:', error);
                    errorDiv.textContent = 'An error occurred while deleting the player.';
                    errorDiv.style.display = 'block';
                    button.classList.remove('confirm-delete');
                    button.innerHTML = '🗑️';
                });
            } else {
                // First click - enter confirmation mode
                errorDiv.style.display = 'none';
                errorDiv.textContent = '';
                button.classList.add('confirm-delete');
                const originalText = button.innerHTML;
                button.innerHTML = '🗑️';
                
                // Reset after 3 seconds
                setTimeout(() => {
                    button.classList.remove('confirm-delete');
                    button.innerHTML = originalText;
                }, 3000);
            }
        }
    </script>
</body>

</html>
