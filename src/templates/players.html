<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Players - SkyRage Scoreboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <script src="/static/delete-confirmation.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Hide the "no players" row when a player is successfully added
            document.body.addEventListener('htmx:afterSwap', function(event) {
                if (event.detail.target.id === 'player-table-body') {
                    const noPlayersRow = document.getElementById('no-players-row');
                    if (noPlayersRow) {
                        noPlayersRow.remove();
                    }
                }
            });
        });
    </script>
    <style>
        .player-table {
            margin: 2rem 0;
            width: 100%;
            border-collapse: collapse;
        }
        .player-table th {
            text-align: left;
            padding: 1rem;
            background: #f5f5f5;
            border-bottom: 2px solid #ddd;
        }
        .player-table td {
            padding: 1rem;
            border-bottom: 1px solid #eee;
        }
        .player-table tr:hover {
            background: #f9f9f9;
        }
        .surname-input {
            width: 100%;
            margin: 0;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1em;
        }
        .surname-input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.1);
        }
        .surname-input::placeholder {
            color: #999;
            font-style: italic;
        }
        .back-button {
            margin: 2rem 0 1rem 0;
        }
        .no-players {
            text-align: center;
            padding: 2rem;
            color: #666;
        }
        .surname-empty {
            color: #999;
            font-style: italic;
        }
        .delete-btn {
            background: transparent;
            border: 1px solid #999;
            color: #666;
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            border-radius: 4px;
            font-size: 1.2em;
            transition: all 0.3s ease;
            margin-right: 0.5rem;
        }
        .delete-btn:hover {
            background: #f0f0f0;
            border-color: #666;
        }
        .delete-btn.confirm-delete {
            background: #dc3545;
            color: white;
            border-color: #dc3545;
        }
        .delete-btn.confirm-delete:hover {
            background: #c82333;
            border-color: #bd2130;
        }
        .player-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        .error-message {
            color: #dc3545;
            font-size: 0.9em;
            margin-top: 0.5rem;
            display: none;
        }
        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 2rem 0 1rem 0;
            gap: 1rem;
        }
        .delete-dangling-btn {
            background: #dc3545;
            color: white;
            border: 1px solid #dc3545;
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        .delete-dangling-btn:hover {
            background: #c82333;
            border-color: #bd2130;
        }
        .delete-dangling-btn.confirm-delete {
            background: #721c24;
            border-color: #721c24;
        }
        .delete-dangling-btn.confirm-delete:hover {
            background: #5a161d;
            border-color: #5a161d;
        }
    </style>
</head>

<body>
    <main class="container">
        <header>
            <h1>Players</h1>
            <p class="lead">View and edit all recorded players.</p>
        </header>
        
        <div class="actions-bar">
            <a href="/" role="button" class="secondary">← Back to Home</a>
            <button 
                id="delete-dangling-btn" 
                class="delete-dangling-btn confirm-delete-htmx"
                hx-delete="/api/dangling_players"
                hx-swap="none"
                title="Delete all players not associated with any game"
            >
                Delete Dangling Players
            </button>
        </div>
        
        <section aria-labelledby="add-player-section">
            <h2 id="add-player-section">Add New Player</h2>
            <form 
                hx-post="/player/create"
                hx-target="#player-table-body"
                hx-swap="afterbegin"
                hx-on::after-request="if(event.detail.successful) this.reset()"
            >
                <div style="display: grid; grid-template-columns: 2fr 2fr 1fr; gap: 1rem; align-items: end;">
                    <div>
                        <label for="new-username">
                            Username
                            <input 
                                type="text" 
                                id="new-username" 
                                name="username" 
                                placeholder="Enter username"
                                required
                                autocomplete="off"
                            />
                        </label>
                    </div>
                    <div>
                        <label for="new-surname">
                            Surname (optional)
                            <input 
                                type="text" 
                                id="new-surname" 
                                name="surname" 
                                placeholder="Enter surname"
                                autocomplete="off"
                            />
                        </label>
                    </div>
                    <div>
                        <button type="submit">Add Player</button>
                    </div>
                </div>
                <div id="create-player-error" class="error-message" style="display: none;"></div>
            </form>
        </section>
        
        <section aria-labelledby="players-section">
            <h2 id="players-section">All Players</h2>
            <table class="player-table">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Surname</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="player-table-body">
                    {% if players %}
                        {% for player in players %}
                        <tr id="player-row-{{ player.username }}">
                            <td><strong>{{ player.username }}</strong></td>
                            <td>
                                <input 
                                    type="text" 
                                    class="surname-input"
                                    name="surname"
                                    value="{{ player.surname or '' }}"
                                    placeholder="(no surname)"
                                    hx-post="/player/update"
                                    hx-trigger="change, blur"
                                    hx-vals='{"username": "{{ player.username }}"}'
                                    hx-swap="none"
                                />
                            </td>
                            <td>
                                <div class="player-actions">
                                    <button 
                                        id="delete-player-{{ player.username }}"
                                        class="delete-btn confirm-delete-htmx" 
                                        hx-delete="/api/players/{{ player.username }}"
                                        hx-target="closest tr"
                                        hx-swap="outerHTML swap:0s"
                                        title="Delete player"
                                    >
                                        🗑️
                                    </button>
                                </div>
                                <div id="error-{{ player.username }}" class="error-message"></div>
                            </td>
                        </tr>
                        {% endfor %}
                    {% else %}
                        <tr id="no-players-row" class="no-players">
                            <td colspan="3" style="text-align: center; padding: 2rem;">
                                No players recorded yet. Add a player using the form above.
                            </td>
                        </tr>
                    {% endif %}
                </tbody>
            </table>
        </section>
    </main>
</body>

</html>
